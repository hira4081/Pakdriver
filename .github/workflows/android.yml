name: Build Android APK

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Google sign-in checks the app's signing SHA-1. A fresh CI runner makes a new
      # debug key every run, so we restore one fixed key from a secret instead.
      - name: Restore fixed signing key
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::DEBUG_KEYSTORE_BASE64 secret not set - Google login will not work on this APK."
          else
            mkdir -p ~/.android
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          fi

      - name: Generate Android project
        run: |
          flutter create --org com.pakdrive --project-name pakdrive --platforms=android .
          python3 tools/patch_android.py

      - run: flutter pub get

      - name: Analyze (informational)
        run: flutter analyze
        continue-on-error: true

      - name: Build release APK
        env:
          API_URL: ${{ secrets.API_URL }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          test -n "$API_URL" || { echo "::error::Set the API_URL secret (https://...)"; exit 1; }
          flutter build apk --release \
            --dart-define=API_URL="$API_URL" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"

      - uses: actions/upload-artifact@v4
        with:
          name: PakDrive-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
